name: roadrescue
description: A new Flutter project.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:       # CRITICAL: Required for every Flutter project - DO NOT REMOVE
    sdk: flutter # CRITICAL: Required for every Flutter project - DO NOT REMOVE
  flutter_localizations:
    sdk: flutter
  
  # CRITICAL: Core UI and responsive design - DO NOT REMOVE OR MODIFY
  supabase_flutter: ^2.9.1
  sizer: ^3.1.3              # Required for responsive design system
  flutter_svg: ^2.0.9        # Required for SVG icon support
  google_fonts: ^8.1.0       # Required for typography (replaces local fonts)
  shared_preferences: ^2.5.3 # Required for local data storage - supports built-in Kotlin
  web: ^1.1.1
  
  # Feature dependencies - safe to modify
  geolocator: ^13.0.1       # GPS location services
  cached_network_image: ^3.3.1
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.0
  crypto: ^3.0.3
  fluttertoast: ^9.1.0 # Latest - supports built-in Kotlin
  universal_html: ^2.2.4
  flutter_stripe: ^12.6.0
  flutter_stripe_web: ^7.6.0
  # Note: stripe_android will need updates from Flutter team for full built-in Kotlin support
  intl: ^0.20.2
  flutter_local_notifications: ^21.0.0
  path_provider: ^2.1.2
  url_launcher: ^6.3.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.0
  http: ^1.2.0
  image_picker: ^1.1.2
  # Note: image_picker_android will need updates from Flutter team for full built-in Kotlin support
  flutter_colorpicker: ^1.1.0

dev_dependencies:
  flutter_test:    # CRITICAL: Required for Flutter project testing - DO NOT REMOVE
    sdk: flutter   # CRITICAL: Required for Flutter project testing - DO NOT REMOVE
  flutter_lints: ^6.0.0 # CRITICAL: Required for code quality - DO NOT REMOVE

flutter:
  uses-material-design: true # CRITICAL: Required for Material icon font - DO NOT REMOVE
  assets:
    - env.json
    - assets/
    - assets/images/
    - assets/lang/
    - assets/fonts/Manrope-Regular.ttf
    - assets/fonts/Manrope-Medium.ttf
    - assets/fonts/Manrope-SemiBold.ttf
    - assets/fonts/Manrope-Bold.ttf
    - assets/fonts/Manrope-ExtraBold.ttf
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
